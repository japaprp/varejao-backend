name: Backend QA

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-qa.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-qa.yml"

permissions:
  contents: read

jobs:
  backend-qa:
    name: Backend syntax and smoke QA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run backend QA
        run: npm run qa

  postgres-integration:
    name: PostgreSQL repository integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: varejao_repository_test
          POSTGRES_USER: repository_test
          POSTGRES_PASSWORD: repository_test
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U repository_test -d varejao_repository_test" --health-interval=5s --health-timeout=3s --health-retries=12
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test against the disposable database
        env:
          VAREJAO_TEST_POSTGRES_URL: postgresql://repository_test:repository_test@127.0.0.1:5432/varejao_repository_test
        run: node scripts/postgres_repository_integration_test.js
